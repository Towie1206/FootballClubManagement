name: Bug report
description: Lỗi có bước tái hiện và bằng chứng
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Bước tái hiện
      description: Ghi dữ liệu đầu vào, thao tác và môi trường.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Log/ảnh/video đã ẩn dữ liệu nhạy cảm

