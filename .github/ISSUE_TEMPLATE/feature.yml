name: User story
description: Theo dõi một chức năng có tiêu chí nghiệm thu rõ ràng
title: "[US] "
labels: ["feature"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Là ai, tôi muốn làm gì, để nhận giá trị gì?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Ghi theo Given/When/Then và gồm trạng thái lỗi.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0, P1, P2]
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Test evidence
      description: Test nào sẽ chứng minh hoàn thành?
    validations:
      required: true

